<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Blending Board</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --muted:#6b7280;
    --onset:#a8d9e7;
    --onset-dark:#8dc9d9;
    --middle:#f4d58a;
    --middle-dark:#e6c36f;
    --ending:#a9ddd4;
    --ending-dark:#8ccdc1;
    --suffix:#efb9d6;
    --suffix-dark:#df9fc3;
    --inactive:#e8eef1;
    --inactive-text:#8a949b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:18px 24px 26px;
  }

  /* UFLI-style top area */
  .topbar{
    position:relative;
    min-height:92px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    margin-bottom:6px;
  }
  .topbar > div:first-child{
    text-align:center;
    width:100%;
  }
  h1{
    font-size:26px;
    font-weight:600;
    margin:0;
    line-height:1.1;
  }
  .lesson{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
  }
  .actions{
    position:absolute;
    right:0;
    top:2px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button{
    border:0;
    background:#fff;
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  button.primary{
    background:#111;
    color:#fff;
  }

  .blend{
    border:0;
    background:#fff;
    padding:0 10px 8px;
    margin:0 auto 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:225px;
    box-shadow:none;
  }
  #word{
    font-size:190px;
    font-weight:400;
    letter-spacing:-3px;
    min-height:215px;
    line-height:1;
  }

  .board{
    display:grid;
    grid-template-columns:1.25fr .95fr 1.25fr .5fr;
    gap:10px;
    align-items:start;
    max-width:980px;
    margin:0 auto;
  }
  .col{
    border:0;
    background:transparent;
    border-radius:0;
    overflow:visible;
    box-shadow:none;
  }
  .col h2{
    display:none;
  }
  .tiles{
    padding:0;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:5px;
  }
  .col:nth-child(2) .tiles{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .col:nth-child(4) .tiles{
    grid-template-columns:1fr;
  }
  .tile{
    min-height:62px;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:0;
    border-radius:9px;
    font-size:29px;
    font-weight:500;
    user-select:none;
    cursor:pointer;
    transition:transform .08s ease, filter .08s ease;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .tile:hover{
    transform:translateY(-1px);
    filter:brightness(.98);
  }
  .col:nth-child(1) .tile{background:var(--onset);}
  .col:nth-child(2) .tile{background:var(--middle);}
  .col:nth-child(3) .tile{background:var(--ending);}
  .col:nth-child(4) .tile{background:var(--suffix);}

  .blank-tile{
    background:#f1f3f5 !important;
    color:#7a838a;
    font-weight:700;
  }
  .blank-tile.selected{
    background:#dfe3e6 !important;
    color:#111;
    box-shadow:inset 0 0 0 2px #111 !important;
  }

  .col:nth-child(1) .tile.selected{
    background:var(--onset-dark);
    box-shadow:inset 0 0 0 2px #111;
  }
  .col:nth-child(2) .tile.selected{
    background:var(--middle-dark);
    box-shadow:inset 0 0 0 2px #111;
  }
  .col:nth-child(3) .tile.selected{
    background:var(--ending-dark);
    box-shadow:inset 0 0 0 2px #111;
  }
  .col:nth-child(4) .tile.selected{
    background:var(--suffix-dark);
    box-shadow:inset 0 0 0 2px #111;
  }

  dialog{
    width:min(780px,calc(100vw - 28px));
    border:0;
    border-radius:14px;
    padding:0;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .modalHead{
    padding:18px 20px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .modalBody{padding:18px 20px}
  .field{margin-bottom:16px}
  label{display:block;font-weight:700;margin-bottom:6px}
  input,textarea{
    width:100%;
    border:1px solid #cfd4da;
    border-radius:8px;
    padding:10px;
    font:inherit;
  }
  textarea{min-height:110px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hint{font-size:13px;color:var(--muted);margin-top:5px}
  .modalFoot{
    padding:14px 20px;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:#111827;
    color:#fff;
    padding:10px 14px;
    border-radius:9px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
  }
  .toast.show{opacity:1}

  @media(max-width:900px){
    .board{grid-template-columns:1fr 1fr}
    .col:nth-child(4) .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
    #word{font-size:130px}
  }
  @media(max-width:620px){
    .wrap{padding:14px}
    .board{grid-template-columns:1fr}
    .tiles,.col:nth-child(2) .tiles,.col:nth-child(4) .tiles{
      grid-template-columns:repeat(4,minmax(0,1fr))
    }
    #word{font-size:88px}
    .actions{position:static;justify-content:center;margin-top:10px}
    .topbar{display:block;text-align:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="boardTitle">Blending Board</h1>
      <div id="lessonLabel" class="lesson"></div>
    </div>
    <div class="actions">
      <button id="clearBtn">Clear Selection</button>
      <button id="customizeBtn">Edit</button>
      <button id="shareBtn" class="primary">Share</button>
    </div>
  </div>

  <div class="blend"><div id="word"></div></div>
  <div id="board" class="board"></div>
</div>

<dialog id="customizeDialog">
  <div class="modalHead">
    <strong>Edit Board</strong>
    <button id="closeDialogBtn" aria-label="Close">✕</button>
  </div>
  <div class="modalBody">
    <div class="grid2">
      <div class="field">
        <label for="lessonInput">Lesson name / number</label>
        <input id="lessonInput" type="text" placeholder="Example: Lesson 87">
      </div>
      <div class="field">
        <label for="titleInput">Board title</label>
        <input id="titleInput" type="text" placeholder="Example: oa / ow Blending Board">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="c1Title">Column 1 title</label>
        <input id="c1Title" type="text">
        <label for="c1Items" style="margin-top:10px">Tiles</label>
        <textarea id="c1Items"></textarea>
        <div class="hint">One tile per line.</div>
      </div>
      <div class="field">
        <label for="c2Title">Column 2 title</label>
        <input id="c2Title" type="text">
        <label for="c2Items" style="margin-top:10px">Tiles</label>
        <textarea id="c2Items"></textarea>
        <div class="hint">One tile per line.</div>
      </div>
      <div class="field">
        <label for="c3Title">Column 3 title</label>
        <input id="c3Title" type="text">
        <label for="c3Items" style="margin-top:10px">Tiles</label>
        <textarea id="c3Items"></textarea>
        <div class="hint">One tile per line.</div>
      </div>
      <div class="field">
        <label for="c4Title">Column 4 title</label>
        <input id="c4Title" type="text">
        <label for="c4Items" style="margin-top:10px">Suffixes</label>
        <textarea id="c4Items"></textarea>
        <div class="hint">One suffix per line. Leave blank if the lesson does not use suffixes.</div>
      </div>
    </div>
  </div>
  <div class="modalFoot">
    <button id="cancelBtn">Cancel</button>
    <button id="applyBtn" class="primary">Apply Changes</button>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<script>
const defaultState = {
  lesson: "Lesson 87",
  title: "oa / ow Blending Board",
  columns: [
    {title:"Beginning", items:["b","c","d","f","g","h","j","l","m","n","p","r","s","t"]},
    {title:"Middle", items:["oa","ow"]},
    {title:"End", items:["d","k","l","m","n","p","s","t"]},
    {title:"+ Suffix", items:["s","es","ed","ing"]}
  ]
};

let state = loadState();
let selected = [null,null,null,null];

function clone(x){ return JSON.parse(JSON.stringify(x)); }

function encodeState(obj){
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeState(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length % 4) str += '=';
  return JSON.parse(decodeURIComponent(escape(atob(str))));
}
function loadState(){
  try{
    if(location.hash.startsWith("#lesson=")){
      return decodeState(location.hash.slice(8));
    }
  }catch(e){}
  return clone(defaultState);
}

function render(){
  document.getElementById("boardTitle").textContent = state.title || "Blending Board";
  document.getElementById("lessonLabel").textContent = state.lesson || "";
  document.title = (state.lesson ? state.lesson + " - " : "") + (state.title || "Blending Board");

  const board = document.getElementById("board");
  board.innerHTML = "";

  state.columns.forEach((col, ci)=>{
    const section = document.createElement("section");
    section.className = "col";

    const h = document.createElement("h2");
    h.textContent = col.title;

    const tiles = document.createElement("div");
    tiles.className = "tiles";

    col.items.forEach((item, ii)=>{
      const t = document.createElement("div");
      t.className = "tile" + (selected[ci]===ii ? " selected" : "");
      t.textContent = item;
      t.tabIndex = 0;

      const choose = ()=>{
        selected[ci] = (selected[ci]===ii ? null : ii);
        render();
      };

      t.addEventListener("click", choose);
      t.addEventListener("keydown", e=>{
        if(e.key==="Enter" || e.key===" "){e.preventDefault();choose();}
      });

      tiles.appendChild(t);
    });

    const blankTile = document.createElement("div");
    blankTile.className = "tile blank-tile" + (selected[ci]==="blank" ? " selected" : "");
    blankTile.textContent = "—";
    blankTile.title = "Remove this part";
    blankTile.setAttribute("aria-label", "Remove this part");
    blankTile.tabIndex = 0;

    const chooseBlank = ()=>{
      selected[ci] = (selected[ci]==="blank" ? null : "blank");
      render();
    };

    blankTile.addEventListener("click", chooseBlank);
    blankTile.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key===" "){e.preventDefault();chooseBlank();}
    });

    tiles.appendChild(blankTile);

    section.appendChild(h);
    section.appendChild(tiles);
    board.appendChild(section);
  });

  const word = selected.map((s,i)=>{
    if(s===null || s==="blank") return "";
    return state.columns[i].items[s] || "";
  }).join("");
  document.getElementById("word").textContent = word;
}

function fillDialog(){
  lessonInput.value = state.lesson || "";
  titleInput.value = state.title || "";
  [0,1,2,3].forEach(i=>{
    document.getElementById(`c${i+1}Title`).value = state.columns[i]?.title || "";
    document.getElementById(`c${i+1}Items`).value = (state.columns[i]?.items || []).join("\n");
  });
}

function getItems(id){
  return document.getElementById(id).value
    .split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2000);
}

const dialog = document.getElementById("customizeDialog");

document.getElementById("customizeBtn").onclick=()=>{
  fillDialog();
  dialog.showModal();
};

document.getElementById("closeDialogBtn").onclick=()=>dialog.close();
document.getElementById("cancelBtn").onclick=()=>dialog.close();

document.getElementById("clearBtn").onclick=()=>{
  selected=[null,null,null,null];
  render();
};

document.getElementById("applyBtn").onclick=()=>{
  state = {
    lesson: lessonInput.value.trim(),
    title: titleInput.value.trim() || "Blending Board",
    columns:[
      {title:c1Title.value.trim() || "Beginning",items:getItems("c1Items")},
      {title:c2Title.value.trim() || "Middle",items:getItems("c2Items")},
      {title:c3Title.value.trim() || "End",items:getItems("c3Items")},
      {title:c4Title.value.trim() || "+ Suffix",items:getItems("c4Items")}
    ]
  };

  selected=[null,null,null,null];
  history.replaceState(null,"",location.pathname + location.search + "#lesson=" + encodeState(state));
  dialog.close();
  render();
  toast("Lesson board updated");
};

document.getElementById("shareBtn").onclick=async()=>{
  const hash = "#lesson=" + encodeState(state);
  history.replaceState(null,"",location.pathname + location.search + hash);
  const url = location.href;

  try{
    await navigator.clipboard.writeText(url);
    if(location.protocol==="file:"){
      toast("Lesson link created — host this file first");
    }else{
      toast("Lesson link copied");
    }
  }catch(e){
    prompt("Copy this lesson link:", url);
  }
};

render();
</script>
</body>
</html>
